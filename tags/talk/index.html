<script>
  // Runs before the first paint, so a remembered theme does not flash the system theme first
  const THEME_KEY = "foresterre:blauwdruk:theme";
  try {
    const theme = localStorage.getItem(THEME_KEY);
    if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
  } catch {}
</script>

  <input type="radio" name="theme" value="system" aria-label="System theme" title="System theme">
  <input type="radio" name="theme" value="light" aria-label="Light theme" title="Light theme">
  <input type="radio" name="theme" value="dark" aria-label="Dark theme" title="Dark theme">
</fieldset>
<script>
  (function () {
    const root = document.documentElement;
    const themeSwitch = document.querySelector(".theme-switch");
    const radios = themeSwitch.querySelectorAll("input");

    function apply(theme) {
      if (theme === "light" || theme === "dark") {
        root.dataset.theme = theme;
      } else {
        theme = "system";
        delete root.dataset.theme;
      }
      radios.forEach((radio) => (radio.checked = radio.value === theme));
    }

    themeSwitch.addEventListener("change", (event) => {
      const theme = event.target.value;
      apply(theme);
      try {
        if (theme === "system") {
          localStorage.removeItem(THEME_KEY);
        } else {
          localStorage.setItem(THEME_KEY, theme);
        }
      } catch {
        console.warn("[blauwdruk] Unable to set theme in localstorage");
      }
    });

    // Keeps other open tabs in sync when the theme changes in one of them
    window.addEventListener("storage", (event) => {
      if (event.key === THEME_KEY || event.key === null) apply(event.newValue);
    });

    apply(root.dataset.theme);
    themeSwitch.hidden = false;
  })();
</script>

<script>
  (function () {
    // This human also must have some fun. Haha. Time for bed :D.
    const hour = document.getElementById("clock-hour");
    const minute = document.getElementById("clock-minute");
    const second = document.getElementById("clock-second");
    function tick() {
      const now = new Date();
      const seconds = now.getSeconds();
      const minutes = now.getMinutes() + seconds / 60;
      const hours = (now.getHours() % 12) + minutes / 60;

      const hourAngle = hours * 30;
      const minuteAngle = minutes * 6;
      const secondAngle = seconds * 6;

      hour.setAttribute("transform", `rotate(${hourAngle} 240 20)`);
      minute.setAttribute("transform", `rotate(${minuteAngle} 240 20)`);
      second.setAttribute("transform", `rotate(${secondAngle} 240 20)`);
    }
    tick();
    setInterval(tick, 1000);
  })();
</script>
