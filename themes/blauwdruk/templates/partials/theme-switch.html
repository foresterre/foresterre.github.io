<fieldset class="theme-switch" hidden>
  <legend class="visually-hidden">Color theme</legend>
  <svg viewBox="0 0 44 40" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1"><path class="construction" d="M22 7V33M7 33L29.5 20M37 33L14.5 20"/><path class="edge" d="M22 7L37 33H7Z" stroke-linejoin="round"/><g class="glyph system"><circle class="knockout" cx="22" cy="7" r="5.2"/><circle cx="22" cy="7" r="3.4"/><path d="M22 3.6A3.4 3.4 0 0 0 22 10.4Z" fill="currentColor"/></g><g class="glyph light"><circle class="knockout" cx="7" cy="33" r="5.2"/><circle cx="7" cy="33" r="2"/><path d="M10.3 33L11.6 33M9.33 35.33L10.25 36.25M7 36.3L7 37.6M4.67 35.33L3.75 36.25M3.7 33L2.4 33M4.67 30.67L3.75 29.75M7 29.7L7 28.4M9.33 30.67L10.25 29.75" stroke-linecap="round"/></g><g class="glyph dark"><circle class="knockout" cx="37" cy="33" r="5.2"/><path d="M37.62 28.6A3.8 3.8 0 1 0 41.45 33.46A3.1 3.1 0 0 1 37.62 28.6Z"/></g><circle class="indicator" cx="22" cy="7" r="6.7"/></g></svg>
  <input type="radio" name="theme" value="system" aria-label="System theme" title="System theme">
  <input type="radio" name="theme" value="light" aria-label="Light theme" title="Light theme">
  <input type="radio" name="theme" value="dark" aria-label="Dark theme" title="Dark theme">
</fieldset>
<script>
  (function () {
    const root = document.documentElement;
    const themeSwitch = document.querySelector(".theme-switch");
    const radios = themeSwitch.querySelectorAll("input");

    function apply(theme) {
      if (theme === "light" || theme === "dark") {
        root.dataset.theme = theme;
      } else {
        theme = "system";
        delete root.dataset.theme;
      }
      radios.forEach((radio) => (radio.checked = radio.value === theme));
    }

    themeSwitch.addEventListener("change", (event) => {
      const theme = event.target.value;
      apply(theme);
      try {
        if (theme === "system") {
          localStorage.removeItem(THEME_KEY);
        } else {
          localStorage.setItem(THEME_KEY, theme);
        }
      } catch {
        console.warn("[blauwdruk] Unable to set theme in localstorage");
      }
    });

    // Keeps other open tabs in sync when the theme changes in one of them
    window.addEventListener("storage", (event) => {
      if (event.key === THEME_KEY || event.key === null) apply(event.newValue);
    });

    apply(root.dataset.theme);
    themeSwitch.hidden = false;
  })();
</script>
